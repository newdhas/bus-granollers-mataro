name: Monitor e13 timetable

# Production validation strategy:
# 1) Generalitat / Mou-te is the primary official source.
# 2) Sagalés is parsed as the operator source and cross-checked against Mou-te.
# 3) data.js changes only when both sources pass validation and app tests succeed.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/monitor-timetable.yml"
      - "scripts/monitor_timetable.py"
      - "scripts/monitor_timetable_dual_source.py"

permissions:
  contents: write
  issues: write

concurrency:
  group: e13-timetable-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install parser dependencies
        run: pip install requests beautifulsoup4 pymupdf

      - name: Validate Mou-te primary source against Sagalés
        id: monitor
        run: python scripts/monitor_timetable_dual_source.py

      - name: Setup Node
        if: steps.monitor.outputs.status == 'updated'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate updated timetable
        id: timetable_tests
        if: steps.monitor.outputs.status == 'updated'
        continue-on-error: true
        run: npm test

      - name: Commit monitor state or timetable update
        if: steps.monitor.outputs.status != 'updated' || steps.timetable_tests.outcome == 'success'
        run: |
          if git diff --quiet -- data.js monitor/e13-state.json; then
            echo "No repository changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js monitor/e13-state.json
          if [ "${{ steps.monitor.outputs.status }}" = "updated" ]; then
            git commit -m "Auto-update e13 timetable validated by Mou-te and Sagalés"
          else
            git commit -m "Update e13 dual-source monitor state"
          fi
          git pull --rebase origin main
          git push origin main

      - name: Open review issue when automatic validation is unsafe
        if: steps.monitor.outputs.alert == 'true' || (steps.monitor.outputs.status == 'updated' && steps.timetable_tests.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          PDF_URL: ${{ steps.monitor.outputs.pdf_url }}
          MONITOR_MESSAGE: ${{ steps.monitor.outputs.message }}
          TEST_OUTCOME: ${{ steps.timetable_tests.outcome }}
        run: |
          title="Horario e13 pendiente de validar"
          existing=$(gh issue list --state open --search "${title} in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "An open review issue already exists: #$existing"
            exit 0
          fi

          if [ "$TEST_OUTCOME" = "failure" ]; then
            reason="El nuevo horario pasó la validación de fuentes, pero los tests de la aplicación fallaron."
          else
            reason="$MONITOR_MESSAGE"
          fi

          body=$(cat <<EOF
          La comprobación automática de la e13 no ha podido validar el cambio con suficiente seguridad.

          **Fuente principal:** Generalitat / Mou-te
          **Fuente de contraste:** Sagalés
          **Fuente detectada:** $PDF_URL

          **Motivo:** $reason

          La web **mantiene el horario anterior**. No se publica ningún cambio hasta que la validación vuelva a ser segura.
          EOF
          )
          gh issue create --title "$title" --body "$body"

      - name: Fail if updated timetable tests failed
        if: steps.monitor.outputs.status == 'updated' && steps.timetable_tests.outcome == 'failure'
        run: exit 1

      - name: Write summary
        if: always()
        run: |
          echo "### Monitor e13" >> "$GITHUB_STEP_SUMMARY"
          echo "- Fuente primaria: Generalitat / Mou-te" >> "$GITHUB_STEP_SUMMARY"
          echo "- Contraste: Sagalés" >> "$GITHUB_STEP_SUMMARY"
          echo "- Estado: ${{ steps.monitor.outputs.status || 'error' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- PDF: ${{ steps.monitor.outputs.pdf_url || 'no disponible' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Frecuencia: cada 6 horas" >> "$GITHUB_STEP_SUMMARY"
