name: Sync Mataró Bus official timetables

on:
  workflow_dispatch:
  schedule:
    - cron: "37 4 * * 1"
  push:
    branches: [main]
    paths:
      - "scripts/sync_mataro_bus.py"
      - "scripts/dump_mataro_pdf_text.py"
      - "scripts/extract_mataro_tables.py"
      - ".github/workflows/sync-mataro-bus.yml"

permissions:
  contents: write

concurrency:
  group: mataro-bus-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 pymupdf

      - name: Download official Avanza PDFs
        run: python scripts/sync_mataro_bus.py

      - name: Extract PDF text for parser development
        run: python scripts/dump_mataro_pdf_text.py

      - name: Detect timetable tables
        run: python scripts/extract_mataro_tables.py

      - name: Commit official timetable files
        run: |
          git add mataro-bus-official mataro-bus-sources.json mataro-bus-pdf-text.json mataro-bus-text mataro-bus-tables.json
          if git diff --cached --quiet; then
            echo "No timetable changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync official Mataró Bus timetables"
          git pull --rebase origin main
          git push origin main

      - name: Summary
        if: always()
        run: |
          echo "### Mataró Bus official timetable sync" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source: Avanza Mataró Bus" >> "$GITHUB_STEP_SUMMARY"
          echo "- Lines expected: 1–8" >> "$GITHUB_STEP_SUMMARY"
