name: Inspect Sagalés timetable link
on:
  push:
    branches: [main]
    paths: [".github/workflows/inspect-sagales.yml"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect pdfBus implementation
        run: |
          python - <<'PY'
          import re, urllib.request
          urls=['https://www.sagales.com/front/js/linia.js','https://www.sagales.com/front/js/script.js']
          for u in urls:
              req=urllib.request.Request(u, headers={'User-Agent':'Mozilla/5.0'})
              text=urllib.request.urlopen(req, timeout=30).read().decode('utf-8','replace')
              print('\n###',u,'bytes',len(text))
              for m in re.finditer(r'pdfBus', text, re.I):
                  a=max(0,m.start()-1000); b=min(len(text),m.end()+2500)
                  print(text[a:b])
          PY
