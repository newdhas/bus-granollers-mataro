name: Inspect Sagalés timetable link
on:
  push:
    branches: [main]
    paths: [".github/workflows/inspect-sagales.yml"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect timetable resolver response
        run: |
          python - <<'PY'
          import time, urllib.request
          u='https://www.sagales.com/front/js-nexus/planificador/pdf.php?id=555&ids=-1&idioma=es&nocache='+str(time.time())
          req=urllib.request.Request(u, headers={'User-Agent':'Mozilla/5.0','Referer':'https://www.sagales.com/es/linia/555'})
          r=urllib.request.urlopen(req, timeout=30)
          body=r.read().decode('utf-8','replace')
          print('URL:',r.geturl())
          print('CONTENT-TYPE:',r.headers.get('content-type'))
          print('BODY-BEGIN')
          print(body[:12000])
          print('BODY-END')
          PY
