name: Inspect Sagalés timetable link
on:
  push:
    branches: [main]
    paths: [".github/workflows/inspect-sagales.yml"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect inline pdfBus implementation
        run: |
          python - <<'PY'
          import re, urllib.request
          u='https://www.sagales.com/es/linia/555'
          req=urllib.request.Request(u, headers={'User-Agent':'Mozilla/5.0'})
          html=urllib.request.urlopen(req, timeout=30).read().decode('utf-8','replace')
          print('HTML bytes:',len(html),'pdfBus occurrences:',len(re.findall(r'pdfBus',html,re.I)))
          for m in re.finditer(r'pdfBus', html, re.I):
              a=max(0,m.start()-1400); b=min(len(html),m.end()+3000)
              print('\n--- pdfBus context ---\n'+html[a:b])
          PY
