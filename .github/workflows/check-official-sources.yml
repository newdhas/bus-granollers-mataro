name: Diagnostic check of Generalitat GTFS

# This GTFS parser is kept only as a manual diagnostic source.
# The production timetable auto-update is handled by monitor-timetable.yml,
# which parses and validates the official Sagalés e13 PDF every 6 hours.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run Generalitat GTFS diagnostic
        run: python3 scripts/check_official_sources_v2.py

      - name: Write summary
        if: always()
        run: |
          echo "### Diagnóstico GTFS e13" >> "$GITHUB_STEP_SUMMARY"
          echo "Este workflow no modifica horarios ni abre incidencias automáticamente." >> "$GITHUB_STEP_SUMMARY"
          echo "La actualización automática de producción usa el PDF oficial de Sagalés mediante monitor-timetable.yml." >> "$GITHUB_STEP_SUMMARY"
